events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript application/x-javascript text/xml application/xml;

    server {
        listen 80;
        server_name _;

        # API — strip /api prefix before forwarding to backend
        location /api/ {
            proxy_pass         http://backend:8000/;
            proxy_set_header   X-Forwarded-For $remote_addr;
            proxy_set_header   Host $host;
            proxy_read_timeout 120s;
        }

        # Auth
        location /auth/ {
            proxy_pass         http://backend:8000;
            proxy_set_header   X-Forwarded-For $remote_addr;
            proxy_set_header   Host $host;
        }

        # Backend utility paths
        location /docs      { proxy_pass http://backend:8000; }
        location /openapi.json { proxy_pass http://backend:8000; }
        location /health    { proxy_pass http://backend:8000; }

        # Frontend — everything else
        location / {
            proxy_pass       http://frontend:4173;
            proxy_set_header Host $host;
        }
    }
}
